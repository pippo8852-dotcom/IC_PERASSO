name: Controlla novità IC Perasso

on:
  schedule:
  - cron: '39 6-19 * * 1-5'   # ogni ora, 7-20 ora italiana (ora non legale), da lunedì a venerdì
  workflow_dispatch: # Permette l'esecuzione manuale da Actions

permissions:
  contents: write

concurrency:
  group: ci-novita-perasso
  cancel-in-progress: false

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python notify.py

      - name: Commit and push changes if any
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add sent_items.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornamento stato novità [skip ci]" && for i in {1..3}; do git push && break || sleep 15; done)
